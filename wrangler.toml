name = "cybatis-games"
main = "worker/index.js"
# Set this to today's date when you deploy — Cloudflare recommends
# keeping this current so the Worker gets the latest runtime defaults.
compatibility_date = "2026-09-23"

# Serves everything in src/ as static assets.
#
# - not_found_handling = "single-page-application": any request that
#   doesn't match a real file (e.g. someone lands directly on a
#   /games/<id> URL instead of via the in-app hash router) gets
#   index.html instead of a bare 404, so the SPA can still boot and
#   route client-side.
# - run_worker_first = ["/api/*"]: without this, the SPA fallback
#   above would swallow /api/* requests too (they don't match a real
#   file either) and return index.html instead of reaching
#   worker/index.js. This makes sure /api/* always hits the Worker.
#   Requires Wrangler >= 4.20.0 — see package.json.
[assets]
directory = "src"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --------------------------------------------------------------
# Environment variables / secrets
# --------------------------------------------------------------
# Do NOT put real secrets here. Use `wrangler secret put <NAME>`
# for anything sensitive (Discord client secret, API keys, etc).
# Non-secret config can go under [vars]:
#
# [vars]
# ENVIRONMENT = "production"
#
# Bindings for future persistence (uncomment and configure once
# the corresponding /api/* endpoint is actually implemented):
#
# [[kv_namespaces]]
# binding = "GAME_STATE"
# id = "<kv-namespace-id>"
#
# [[d1_databases]]
# binding = "DB"
# database_name = "cybatis-games"
# database_id = "<d1-database-id>"
